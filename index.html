<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Game</title>
    <!--CSS-->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="init-amt">Welcome</h1>
    <h2 id="coins"></h2>
    <img src="./1.png" alt="" id="dice" height="200px">
    <p id="result">Fill And Click the button to roll the dice!</p>
    <input type="text"  name="bid-amount" id="bidamt" placeholder="enter your bid amount" required>
    <br>
    <br>
    <input type="text" name="bid-number" id="bidnum" placeholder="enter your bid number" required>
    <br>
    <br>
    <button type='submit' id="btn" onclick="rollDice()">Roll Dice</button>



    <!--JavaScript-->
    <script src="app.js"></script>
</body>
</html>
