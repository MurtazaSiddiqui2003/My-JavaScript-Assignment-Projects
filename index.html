<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="cont">
        <h1>Counter App</h1>
        <h2 id="num">0</h2>
        <button id="inc" onclick="inc()">Incrememt</button>
        <button id="dec" onclick="dec()">Decrement</button>
        <button id="res" onclick="res()">Reset</button>
    </div>

    <script>
        var h2 = document.getElementById("num")
        var value = 0

        function inc() {
            value++;
            h2.textContent = value
        }

        function dec() {
            value--;
            h2.textContent = value
        }

        function res() {
            value = 0;
            h2.textContent = value
        }

    </script>
</body>

</html>
